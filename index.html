<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symulator Boga 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe9f4;--surface:#fbf8fd;--ink:#2b2240;--mute:#6d6384;--accent:#a8641a;--line:#d6cbe3;--btn:#e4dbee;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1930;--surface:#292341;--ink:#ece6f6;--mute:#a79cc0;--accent:#e6ab5c;--line:#3d3560;--btn:#352d52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1930;--surface:#292341;--ink:#ece6f6;--mute:#a79cc0;--accent:#e6ab5c;--line:#3d3560;--btn:#352d52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:min(1280px,100%);margin:0 auto;padding:16px 14px 28px}
h1{font:600 28px/1.1 Fraunces,Georgia,serif;margin:4px 0 2px}
.sub{color:var(--accent);margin:0 0 2px;font-weight:600}
.goal{color:var(--mute);margin:0 0 12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:600 19px/1.1 Fraunces,Georgia,serif}
.stat:first-child b{color:var(--accent)}
.stat span{font-size:12px;color:var(--mute)}
.world{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
#box{height:clamp(280px,56vh,760px);border-radius:9px;overflow:hidden;background:#05030c}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
.powers{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 6px;-webkit-overflow-scrolling:touch}
.powers button{flex:0 0 auto;font:600 14px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--btn);border:2px solid transparent;border-radius:10px;padding:8px 12px;text-align:left;cursor:pointer;min-width:96px}
.powers button small{display:block;font-weight:400;color:var(--mute)}
.powers button.on{border-color:var(--accent);background:var(--surface)}
.powers button:disabled{opacity:.45}
.powers button:focus-visible,.reset:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.desc{margin:4px 0 10px;font-size:14px;color:var(--mute);min-height:2.8em}
.log{background:var(--surface);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-style:italic;min-height:3em}
.reset{margin-top:12px;font:600 14px Figtree,system-ui,sans-serif;background:none;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  .dev{border-left-color:#c0202a;margin-top:8px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}

.end{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));text-align:center;color:#fff;overflow:auto;animation:fin .7s}
.e1{background:radial-gradient(circle at 50% 35%,#5a0710,#14020a 75%)}
.e2{background:radial-gradient(circle at 50% 35%,#0b3a4a,#06121c 75%)}
.end svg{width:min(68vw,290px);height:auto;overflow:visible}
.end h2{font:600 30px/1.1 Fraunces,Georgia,serif;margin:0}
.end p{max-width:420px;margin:0;color:#eadff0}
.end .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.end button{font:600 15px Figtree,system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.end button:focus-visible{outline:3px solid #ffd27a;outline-offset:2px}
.ha{font:600 24px Fraunces,Georgia,serif;color:#ff8a7a;letter-spacing:.14em;animation:hop .45s infinite alternate}
.e1 svg{animation:shk .3s infinite alternate;transform-origin:50% 80%}
.jaw{animation:jaw .25s infinite alternate}
.smoke{opacity:0;animation:smk 2.4s infinite ease-out}
@keyframes fin{from{opacity:0}}
@keyframes hop{to{transform:translateY(-6px)}}
@keyframes shk{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes jaw{to{transform:translateY(7px)}}
@keyframes smk{0%{transform:translateY(0);opacity:.6}100%{transform:translateY(-34px);opacity:0}}
@media(prefers-reduced-motion:reduce){.end *,.end{animation:none!important}}
.reset+.reset{margin-left:8px}
</style>
</head>
